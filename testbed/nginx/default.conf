# Docker's internal DNS. Looking the API up again every few seconds
# matters here: the testbed kills and restarts containers all the time,
# and a restarted container can come back with a different IP. A plain
# upstream block resolves "api" only once, at nginx start, and then
# keeps sending traffic to the old address (502 Bad Gateway).
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        set $api http://api:5000;
        proxy_pass $api;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}