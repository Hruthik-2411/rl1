# Default environment settings, written out so you can see and tweak them.
# Pass a copy with --config to train.py. Anything left out keeps the
# default from faultdiag/env/config.py.

fault_prior: [0.15, 0.17, 0.17, 0.17, 0.17, 0.17]   # no_fault, cpu, mem, net, crash, db
p_high_severity: 0.5

# sources: telemetry, probe, logs, deep
base_cost: [1.0, 3.0, 5.0, 15.0]
latency: [1, 1, 2, 3]
cost_mult_range: [0.5, 2.0]
degradation_range: [0.0, 0.35]
p_unavailable: [0.0, 0.05, 0.05, 0.15]
budget_range: [10.0, 40.0]

# repairs: restart, scale_out, reroute, kill_leaky, failover_db
repair_cost: [5.0, 12.0, 8.0, 5.0, 20.0]
repair_time: 3
disruption_penalty: 20.0
max_time: 30

reward_fix: 100.0
downtime_cost: 3.0
query_cost_weight: 1.0
miss_penalty: 100.0
escalate_cost: 60.0
timeout_penalty: 80.0

obs_mode: belief
include_context: true
